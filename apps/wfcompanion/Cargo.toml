[package]
name = "wfcompanion"
# Cargo requires a literal; build.rs verifies it against ../../VERSION.
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
description = "Linux/Proton Warframe observer and overlay companion for wfdaemon"
build = "build.rs"

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
fontdue = "0.9.3"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
taffy = { version = "0.12.2", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid"] }
tokio = { version = "1", features = ["macros", "rt", "sync"] }
wayland-client = "0.31"
x11rb = "0.13"
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "tokio"] }
